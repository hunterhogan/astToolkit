# path-sync copy -n hunterhogan
[project]
name = "astToolkit"
version = "0.14.1"
description = "A powerfully composable, type-safe toolkit for Python abstract syntax tree (AST) manipulation, analysis, transformation, and code generation with a layered architecture designed for building sophisticated code processing assembly-lines."
readme = "README.md"
requires-python = ">=3.14"
license = "CC-BY-NC-4.0"
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
keywords = [
  "abstract syntax tree",
  "ast",
  "ast-analysis",
  "ast-manipulation",
  "ast-predicate",
  "ast-traversal",
  "ast-visitor",
  "code-analysis",
  "code-refactoring",
  "code generation",
  "code transformation",
  "composable-apis",
  "function-inlining",
  "metaprogramming",
  "python-ast",
  "source-code-generation",
  "static-analysis",
  "type-safe",
  "typed-ast",
  "visitor-pattern",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["hunterMakesPy>=0.10.0"]
optional-dependencies = { testing = ["hypothesis", "pytest-cov", "pytest-xdist", "pytest>=9.0"] }

[project.urls]
Donate = "https://www.patreon.com/integrated"
Homepage = "https://github.com/hunterhogan/astToolkit"
Issues = "https://github.com/hunterhogan/astToolkit/issues"
Repository = "https://github.com/hunterhogan/astToolkit.git"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage]
report = { exclude_also = [
  "@overload",
  "^\\s*\\.\\.\\.$",
  "if __name__ == \"__main__\":",
  "if TYPE_CHECKING:",
], ignore_errors = false }
run = { branch = true, data_file = "tests/coverage/.coverage", omit = ["tests/*"], source = ["."] }

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.isort]
add_imports = ["from __future__ import annotations"]
combine_as_imports = true
extend_skip_glob = ["*.ipynb", "*.pyi"]
filter_files = true
force_alphabetical_sort_within_sections = true
from_first = true
honor_noqa = true
indent = "\t"
line_length = 140
lines_after_imports = 1
lines_between_types = 0
multi_line_output = 4
no_sections = true
overwrite_in_place = true
use_parentheses = true
# === OK_EDIT: path-sync hunterhogan ===

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.pyrefly]
preset = "strict"
enabled-ignores = ["pyrefly"]
infer-with-first-use = false
project-excludes = [
  "typings",
  "typings/**/*",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
  ".vAnalysis",
]
site-packages-path = ["./typings"]
# === OK_EDIT: path-sync hunterhogan ===

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.pyrefly.errors]
bad-return = "warn"
invalid-type-var = "warn"
invalid-yield = "warn"
protected-access = "warn"
redundant-condition = "warn"
# === OK_EDIT: path-sync hunterhogan ===

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.pyright]
deprecateTypingAliases = true
disableBytesTypePromotions = true
enableReachabilityAnalysis = true
enableTypeIgnoreComments = false
exclude = ["typings", "typings/**", "**/node_modules", "**/__pycache__", "**/.*", ".venv", ".vAnalysis"]
reportConstantRedefinition = false
reportInvalidTypeVarUse = false
reportPrivateUsage = false
reportReturnType = "warning"
reportUnnecessaryIsInstance = false
reportUnusedClass = "information"
reportUnusedExpression = "information"
reportUnusedFunction = "information"
reportUnusedImport = "information"
reportUnusedVariable = "information"
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
typeCheckingMode = "strict"
# === OK_EDIT: path-sync hunterhogan ===

[tool.pytest]
addopts = ["--color=yes"]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
  "error",
  # The samples of abstract classes, such as `Make.expr()`, instantiate abstract `ast` classes on purpose.
  "ignore:Instantiating abstract AST node class:DeprecationWarning",
]
log_auto_indent = "On"
minversion = "9.0"
strict = true
testpaths = ["tests"]

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.ruff]
line-length = 140
# === OK_EDIT: path-sync hunterhogan ===

