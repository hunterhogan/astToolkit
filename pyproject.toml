# path-sync copy -n hunterhogan
[project]
name = "astToolkit"
version = "0.14.2"
description = "A powerfully composable, type-safe toolkit for Python abstract syntax tree (AST) manipulation, analysis, transformation, and code generation with a layered architecture designed for building sophisticated code processing assembly-lines."
readme = "README.md"
requires-python = ">=3.14"
license = "CC-BY-NC-4.0"
authors = [{ name = "Hunter Hogan", email = "HunterHogan@pm.me" }]
keywords = [
  "abstract syntax tree",
  "ast",
  "ast-analysis",
  "ast-manipulation",
  "ast-predicate",
  "ast-traversal",
  "ast-visitor",
  "code-analysis",
  "code-refactoring",
  "code generation",
  "code transformation",
  "composable-apis",
  "function-inlining",
  "metaprogramming",
  "python-ast",
  "source-code-generation",
  "static-analysis",
  "type-safe",
  "typed-ast",
  "visitor-pattern",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["hunterMakesPy>=0.10.0"]

[project.urls]
Donate = "https://www.patreon.com/integrated"
Homepage = "https://github.com/hunterhogan/astToolkit"
Issues = "https://github.com/hunterhogan/astToolkit/issues"
Repository = "https://github.com/hunterhogan/astToolkit.git"

[dependency-groups]
testing = ["hypothesis", "pytest>=9.0", "pytest-cov", "pytest-xdist"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.coverage]
report = { exclude_also = [
  "@overload",
  "^\\s*\\.\\.\\.$",
  "if __name__ == \"__main__\":",
  "if TYPE_CHECKING:",
], ignore_errors = false }
run = { branch = true, data_file = "tests/coverage/.coverage", omit = ["tests/*"], source = ["."] }

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.isort]
add_imports = ["from __future__ import annotations"]
append_only = true
atomic = true
combine_as_imports = true
extend_skip_glob = ["*.pyi"]
filter_files = true
force_alphabetical_sort_within_sections = true
from_first = true
honor_noqa = true
indent = "\t"
line_length = 140
lines_after_imports = 1
lines_between_types = 0
multi_line_output = 4
no_sections = true
skip_gitignore = true
use_parentheses = true
# === OK_EDIT: path-sync hunterhogan ===

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.pyrefly]
enabled-ignores = ["pyrefly"]
# ignore-errors-in-generated-code = true
infer-with-first-use = false
preset = "strict"
python-platform = "all"
# === OK_EDIT: path-sync hunterhogan ===

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.pyrefly.errors]
bad-return = "warn"
invalid-yield = "warn"
# === OK_EDIT: path-sync hunterhogan ===

[tool.pytest]
addopts = ["--color=yes"]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
  "error",
  # The samples of abstract classes, such as `Make.expr()`, instantiate abstract `ast` classes on purpose.
  "ignore:Instantiating abstract AST node class:DeprecationWarning",
]
log_auto_indent = "On"
minversion = "9.0"
strict = true
testpaths = ["tests"]

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.ruff]
line-length = 140
# === OK_EDIT: path-sync hunterhogan ===

# === DO_NOT_EDIT: path-sync hunterhogan ===
[tool.ruff.lint]
allowed-confusables = ["–", "’", "′", "×", "−", "∖", "∗", "∣", "∨", "∪", "∼", "⊗", "ℂ", "ℋ", "ℒ", "ℓ", "ℕ", "ℙ", "ℚ", "ℝ", "ℤ", "ℰ", "ℱ", "𝒪", "𝒮", "𝔼", "𝕀", "𝟙", "α", "Β", "γ", "ι", "Κ", "ν", "ο", "ρ", "σ"]
future-annotations = true
ignore = [
  # ====== Linters ===========
  "FIX",  # flake8-fixme
  "I",  # isort
  "N",  # pep8-naming
  "TD",  # flake8-todos
  # ====== complexity ========
  "dict-index-missing-items",
  "explicit-f-string-type-conversion",
  "non-pep695-type-alias",
  "redundant-numeric-union",
  "static-join-to-f-string",
  "unnecessary-literal-dict",
  "useless-import-alias",
  # ====== correctness =======
  "unused-variable",
  # ====== formatting ========
  "bad-quotes-inline-string",
  "blank-lines-after-function-or-class",
  "blank-lines-top-level",
  "docstring-tab-indentation",
  "incorrect-blank-line-after-class",
  "line-too-long",
  "missing-newline-at-end-of-file",
  "missing-trailing-comma",
  "no-space-after-block-comment",
  "tab-indentation",
  "too-many-blank-lines",
  # ====== pedantic ==========
  "any-type",
  "blanket-noqa",
  "docstring-in-stub",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "if-else-block-instead-of-if-exp",
  "incorrect-section-order",
  "magic-value-comparison",
  "missing-copyright-notice",
  "missing-trailing-period",
  "non-ascii-import-name",
  "non-ascii-name",
  "non-imperative-mood",
  "redefined-loop-name",
  "superfluous-else-continue",
  "superfluous-else-return",
  "too-many-arguments",
  "too-many-branches",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-statements",
  "typed-argument-default-in-stub",
  "yoda-conditions",
  # ====== restriction =======
  "complex-structure",
  # ====== security ==========
  "subprocess-without-shell-equals-true",
  "suspicious-pickle-import",
  # ====== style =============
  "snake-case-type-alias",
  "type-name-incorrect-variance",
  # ====== suspicious ========
  "self-or-cls-assignment",
  "subclass-builtin",
  "unused-import",
  "useless-else-on-loop",
]
preview = true
select = ["ALL"]
extend-select = ["missing-terminal-punctuation", "undocumented-param", "undocumented-public-init"]
task-tags = ["DEVELOPMENT", "FailEarly", "NOTE", "SEMIOTICS", "TODO"]
